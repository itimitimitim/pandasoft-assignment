spring.application.name=leave-management-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leave_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leave}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:leave}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
springdoc.swagger-ui.path=/swagger-ui.html
security.jwt.secret=${JWT_SECRET:change-this-development-secret-key-please-32-bytes}
security.jwt.expiration=${JWT_EXPIRATION:PT8H}
leave.holidays-2026=${LEAVE_HOLIDAYS_2026:2026-01-01,2026-02-17,2026-04-13,2026-04-14,2026-04-15,2026-05-01,2026-05-04,2026-06-03,2026-07-28,2026-08-12,2026-10-13,2026-12-10,2026-12-31}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.admin.auto-create=true
kafka.topics.leave-approved=${KAFKA_LEAVE_APPROVED_TOPIC:leave.approved}
